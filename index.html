<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0a2e" />
    <meta name="description" content="Alex's Craft Calc — power soap lye & candle wax calculator. Alien Purple." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Alex's Craft Calc — Soap & Candle</title>
    <script>
      (function () {
        var known = ['en','es','fr','de','pt-BR','it','ru','pl','ja','ko','zh-CN']
        function match(tags) {
          for (var i = 0; i < tags.length; i++) {
            var tag = String(tags[i] || '').toLowerCase()
            if (!tag) continue
            if (tag === 'pt' || tag.indexOf('pt-') === 0) return 'pt-BR'
            if (tag === 'zh' || tag === 'zh-cn' || tag.indexOf('zh-hans') === 0 || tag === 'zh-sg') return 'zh-CN'
            if (tag === 'zh-tw' || tag === 'zh-hk' || tag.indexOf('zh-hant') === 0 || tag === 'zh-mo') continue
            var primary = tag.split('-')[0]
            if (primary === 'en') return 'en'
            if (known.indexOf(primary) >= 0) return primary
          }
          return 'en'
        }
        var loc = 'en'
        try {
          var raw = localStorage.getItem('alien-craft-prefs')
          var prefs = raw ? JSON.parse(raw) : null
          if (prefs && known.indexOf(prefs.locale) >= 0) loc = prefs.locale
          else if (!raw) loc = match(navigator.languages || [navigator.language])
        } catch (e) {}
        document.documentElement.lang = loc
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
