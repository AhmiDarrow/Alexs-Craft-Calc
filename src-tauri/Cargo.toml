[package]
name = "alexs-craft-calc"
version = "1.0.2"
description = "Alex's Craft Calc — Alien Purple soap & candle calculator"
authors = ["AhmiDarrow"]
license = "MIT"
repository = "https://github.com/AhmiDarrow/alexs-craft-calc"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "alexs_craft_calc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
