[package]
name = "alexs-craft-calc"
version = "2.1.0"
description = "Alex's Craft Calc on RemedyUI: soap and candle calculators with the craft wiki"
authors = ["AhmiDarrow"]
license = "MIT"
repository = "https://github.com/AhmiDarrow/alexs-craft-calc"
edition = "2024"
publish = false

[lib]
name = "craft_calc"
# The APK and the web page load the app as a library; the desktop links it into src/main.rs.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "alexs-craft-calc"
path = "src/main.rs"

[dependencies]
remedy-ui = { path = "../../RemedyUI/crates/remedy-ui", features = ["image", "rich", "webstorage"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
remedy-ui = { path = "../../RemedyUI/crates/remedy-ui", features = ["image", "rich", "webstorage", "web"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlIFrameElement", "console"] }

[dev-dependencies]
flate2 = "1"
remedy-ui = { path = "../../RemedyUI/crates/remedy-ui", features = ["image", "rich", "webstorage", "headless"] }

[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
