<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a0a2e"/>
      <stop offset="1" stop-color="#0a0614"/>
    </linearGradient>
    <linearGradient id="soap" x1="14" y1="18" x2="50" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3e8ff"/>
      <stop offset="0.35" stop-color="#c084fc"/>
      <stop offset="0.7" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="shine" x1="20" y1="22" x2="44" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <ellipse cx="32" cy="36" rx="22" ry="14" fill="#a855f7" opacity="0.18"/>
  <!-- purple soap bar -->
  <g filter="url(#glow)">
    <rect x="12" y="22" width="40" height="22" rx="7" fill="url(#soap)"/>
    <rect x="14" y="24" width="36" height="8" rx="4" fill="url(#shine)"/>
    <path d="M18 33c4 3 10 5 14 5s10-2 14-5" stroke="#f5e9ff" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
